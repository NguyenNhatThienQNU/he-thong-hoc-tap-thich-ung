[project]
name = "ai-goi-mo"
version = "1.0.0"
description = "AI Gợi Mở – hệ thống hỗ trợ học tập thích ứng bằng trí tuệ nhân tạo cho học sinh THPT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "google-genai>=1.40",
    "segno>=1.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "tzdata>=2024.1",
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # dòng dài trong chuỗi tiếng Việt
    "B008",    # FastAPI Depends/Form trong tham số mặc định
    "RUF001",  # ký tự Unicode trong chuỗi (tiếng Việt)
    "RUF002",
    "RUF003",
    "RUF012",
    "SIM108",
    "B905",
]

[tool.uv]
package = false  # chỉ cài thư viện, không đóng gói dự án (Vercel dùng uv)
